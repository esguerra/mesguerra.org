{% extends "layout.html" %}
{% block content %}
<title>{{ tree.name }}</title>
<h1>Index of /{{ tree.name }}/</h1>
<ul>
{%- for item in tree.children recursive %}
    <li>
      <a href="{{ url_for('static', filename='scripts/' ~ item.name) }}">{{ item.name }}</a>
      {%- if item.children %}
        <ul>{{ loop(item.children) }}</ul>
      {%- endif %}
    </li>
{%- endfor %}
</ul>
{% endblock content %}
